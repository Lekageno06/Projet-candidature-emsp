services:
  - type: web
    name: emsp-portail
    runtime: python
    plan: free
    autoDeployTrigger: commit
    buildCommand: pip install -r back_end/requirements.txt
    startCommand: gunicorn --chdir back_end app:app --bind 0.0.0.0:$PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: FLASK_DEBUG
        value: 'false'
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: COOKIE_SECURE
        value: 'true'
      - key: UPLOAD_FOLDER
        value: /tmp/emsp-uploads
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: '3306'
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: CLOUDCONVERT_API_KEYS
        sync: false
      - key: CLOUDCONVERT_ENABLED
        value: 'true'
      - key: CLOUDCONVERT_TIMEOUT
        value: '180'
